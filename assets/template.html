<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title><!--@TITLE@--></title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="preview">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Une baie de serveurs : chaque diapositive est une « unité » plein écran ; bandeau haut = étiquette de baie,
   bas = rangée de LED de progression. Encre ardoise sur gris froid, ambre = accent, sarcelle = télémétrie. */
:root {
  --paper: #ECEFF1; --panel: #FFFFFF; --ink: #15232D; --muted: #586A76; --line: #C6D0D7;
  --amber: #B8600C; --teal: #0F6E7D; --ok: #2A7A4B; --warn: #9A6200; --fail: #B3261E;
  --code-bg: #15232D; --code-fg: #DDE6EB; --code-dim: #7F95A3; --code-line: #2A3C48;
  --t-amber: #F0A04B; --t-teal: #6FC7D6; --t-ok: #7DD3A8; --t-fail: #E58A8A; --t-warn: #E2B24E; --t-violet: #C9A7F5;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  /* schémas en traits : une police système qui a tous les glyphes, pour que les colonnes tombent juste */
  --mono-box: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Cascadia Mono", "DejaVu Sans Mono", "Liberation Mono", "Adwaita Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E161C; --panel: #15212A; --ink: #E3EAEE; --muted: #8DA0AC; --line: #283944;
    --amber: #F0A04B; --teal: #4DB4C4; --ok: #5DC28C; --warn: #E2B24E; --fail: #EE8A80;
    --code-bg: #0A1015; --code-fg: #DDE6EB; --code-line: #1E2C36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E161C; --panel: #15212A; --ink: #E3EAEE; --muted: #8DA0AC; --line: #283944;
  --amber: #F0A04B; --teal: #4DB4C4; --ok: #5DC28C; --warn: #E2B24E; --fail: #EE8A80;
  --code-bg: #0A1015; --code-fg: #DDE6EB; --code-line: #1E2C36;
  color-scheme: dark;
}
/*@ACCENT@*/

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 17px/1.55 var(--body); overflow: hidden; -webkit-text-size-adjust: 100%; }
.app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
a { color: var(--teal); text-underline-offset: 2px; }
button { font: inherit; }

/* Bandeau haut : étiquette de baie */
.bar {
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.bar b { color: var(--ink); font-weight: 500; }
.bar .tag { display: flex; gap: 10px; align-items: center; min-width: 0; }
.bar .tag span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .right { display: flex; gap: 14px; align-items: center; flex: none; }
.bar .right > span { white-space: nowrap; }
.iconbtn { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); flex: none; }

/* Scène */
.stage { position: relative; overflow: hidden; }
.slide {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-block: clamp(20px, 4vh, 48px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  visibility: hidden; opacity: 0; transform: translateX(24px);
  transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
}
.slide.active { visibility: visible; opacity: 1; transform: none; transition: opacity .35s ease, transform .35s ease; }
.slide.before { transform: translateX(-24px); }
.inner { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(16px, 2.6vh, 26px); min-height: 100%; justify-content: center; min-width: 0; }
.inner > * { min-width: 0; }

.eyebrow { font: 500 12px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--teal); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.eyebrow .num { color: var(--amber); }
h1, h2 { font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance; line-height: .95; letter-spacing: .005em; overflow-wrap: anywhere; }
h1 { font-size: clamp(56px, 13vw, 168px); }
h2 { font-size: clamp(34px, 5.6vw, 66px); text-transform: uppercase; }
h3.sub { font: 600 17px/1.3 var(--body); margin: 4px 0 -6px; }
h4.sub2 { font: 500 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 -8px; }
p { margin: 0; max-width: 68ch; }
.lead { font-size: clamp(18px, 2.1vw, 23px); line-height: 1.45; max-width: 52ch; }
.muted { color: var(--muted); }
code { font-family: var(--mono); font-size: .88em; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
em { font-style: normal; color: var(--amber); font-weight: 600; }
strong { font-weight: 600; }
ul.md, ol.md { margin: 0; padding: 0; display: grid; gap: 8px; max-width: 70ch; }
ul.md { list-style: none; }
ul.md > li { padding-left: 18px; position: relative; }
ul.md > li::before { content: ""; position: absolute; left: 0; top: .66em; width: 8px; height: 2px; background: var(--teal); }
ul.md ul.md > li::before { width: 5px; background: var(--muted); }
ol.md { list-style: none; counter-reset: li; }
ol.md > li { counter-increment: li; padding-left: 30px; position: relative; }
ol.md > li::before { content: counter(li, decimal-leading-zero); position: absolute; left: 0; top: .2em; font: 600 12px/1.4 var(--mono); color: var(--amber); }
li > ul.md, li > ol.md { margin-top: 6px; gap: 4px; font-size: .94em; color: var(--muted); }
blockquote { margin: 0; font-size: clamp(17px, 1.9vw, 21px); border-left: 3px solid var(--amber); padding: 4px 0 4px 16px; max-width: 62ch; display: grid; gap: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(20px, 3vw, 44px); align-items: start; }
.cols > .col { min-width: 0; display: grid; gap: 14px; align-content: start; }

/* Encadrés */
.callout { --k: var(--teal); border: 1px solid color-mix(in srgb, var(--k) 40%, var(--line)); border-left: 4px solid var(--k); border-radius: 5px; padding: 12px 16px; background: color-mix(in srgb, var(--k) 7%, var(--panel)); display: grid; gap: 6px; max-width: 78ch; }
.callout .ch { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.callout .ch b { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--k); }
.callout .ch .ct { font-weight: 600; }
.callout p { font-size: 15.5px; }
.k-tip { --k: var(--ok); } .k-warning, .k-caution { --k: var(--warn); } .k-danger { --k: var(--fail); } .k-important { --k: var(--amber); }

/* Couverture : la baie */
.cover { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: center; }
.cover.solo { grid-template-columns: minmax(0, 1fr); }
.cover-main { display: grid; gap: 22px; min-width: 0; }
.cover .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font: 500 13px/1.4 var(--mono); color: var(--muted); }
.rack { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.rack-head { display: flex; justify-content: space-between; gap: 10px; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 2px 4px 6px; }
.unit {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px;
  background: repeating-linear-gradient(90deg, transparent 0 6px, color-mix(in srgb, var(--ink) 4%, transparent) 6px 7px);
}
.unit .led { animation: blink 2.4s infinite; }
.unit:nth-child(3) .led { animation-delay: .5s; } .unit:nth-child(4) .led { animation-delay: 1.1s; } .unit:nth-child(5) .led { animation-delay: 1.7s; }
.unit b { font: 600 15px/1.2 var(--mono); }
.unit small { display: block; color: var(--muted); font: 400 12.5px/1.35 var(--body); }
.unit .ip { font: 500 13px/1 var(--mono); color: var(--teal); font-variant-numeric: tabular-nums; }
@keyframes blink { 0%, 86%, 100% { opacity: 1 } 90% { opacity: .25 } }

/* Annexes */
.slide.appendix { background: repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--ink) 2.5%, transparent) 14px 15px); }
.slide.appendix h2 { font-size: clamp(30px, 4.4vw, 52px); }
.slide.appendix .eyebrow .num { border: 1px solid currentColor; padding: 3px 6px; border-radius: 3px; }

/* Blocs verbatim */
.scroll-x { overflow-x: auto; max-width: 100%; }
pre.tree { font: 400 14px/1.35 var(--mono-box); margin: 0; white-space: pre; color: var(--ink); padding: 4px 0; }
.codebox { margin: 0; min-width: 0; border-radius: 6px; overflow: hidden; background: var(--code-bg); border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
.code-cap { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--code-dim); padding: 10px 18px 0; }
pre.code { margin: 0; color: var(--code-fg); padding: 14px 18px 16px; font: 400 13.5px/1.6 var(--mono); overflow-x: auto; }
pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
pre.code .c { color: var(--code-dim); }

/* Tableaux */
.tbl { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; }
table.t th, table.t td { text-align: left; vertical-align: top; padding: 10px 16px 10px 0; border-bottom: 1px solid var(--line); }
table.t th { font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--ink); white-space: nowrap; }
table.t.multi td:first-child { font-weight: 600; }

/* Onglets */
.w-tabs { display: grid; gap: 16px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 600 14px/1 var(--mono); padding: 10px 14px; border-radius: 4px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.tab code { background: none; padding: 0; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tabpanel { display: grid; gap: 14px; animation: fade .3s ease; min-width: 0; }
.tabpanel[hidden] { display: none; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tab:focus-visible, .navbtn:focus-visible, .replay:focus-visible, .iconbtn:focus-visible, .pl-btn:focus-visible, .dot:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Pipeline */
.w-pipe { display: grid; gap: 18px; min-width: 0; }
.cmdline { font: 500 clamp(14px, 1.8vw, 18px)/1.4 var(--mono); background: var(--code-bg); color: var(--code-fg); padding: 14px 18px; border-radius: 6px; overflow-x: auto; white-space: nowrap; }
.cmdline::before { content: "$ "; color: var(--t-amber); }
.pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0; counter-reset: s; }
.pipe li { position: relative; padding: 30px 14px 0 0; counter-increment: s; opacity: .55; transition: opacity .3s; }
.pipe li.lit { opacity: 1; }
.pipe li::before {
  content: counter(s); position: absolute; top: 0; left: 0; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font: 600 11px/1 var(--mono); background: var(--panel); border: 1.5px solid var(--line); color: var(--muted);
  z-index: 1; transition: background .25s, border-color .25s, color .25s, box-shadow .25s;
}
.pipe li::after { content: ""; position: absolute; top: 10px; left: 22px; right: 0; height: 2px; background: var(--line); transition: background .3s; }
.pipe li:last-child::after { display: none; }
.pipe b { display: block; font: 600 14px/1.3 var(--mono); }
.pipe span { display: block; font-size: 13.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.pipe li.lit::before { background: var(--teal); border-color: var(--teal); color: var(--panel); box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 18%, transparent); }
.pipe li.lit:has(+ li.lit)::after { background: var(--teal); }
.replay { justify-self: start; align-self: flex-start; font: 500 13px/1 var(--mono); padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.replay:hover { border-color: var(--muted); }

/* Terminal animé */
.term { background: var(--code-bg); color: var(--code-fg); border-radius: 8px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); min-width: 0; }
.term-top { display: flex; gap: 6px; align-items: center; padding: 8px 10px 8px 12px; background: color-mix(in srgb, var(--code-bg) 80%, #5A6B77); }
.term-top i { width: 10px; height: 10px; border-radius: 50%; background: #5A6B77; flex: none; }
.term-top span { margin-left: 8px; font: 500 11px/1 var(--mono); color: #9FB0BB; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.replay.mini { background: transparent; color: #9FB0BB; border-color: #3A4C58; padding: 5px 8px; font-size: 11px; }
.term-out { margin: 0; padding: 16px 18px; font: 400 13.5px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; min-height: 8em; }
.term .p { color: var(--t-amber); } .term .c { color: var(--code-dim); } .term .g { color: var(--t-ok); } .term .r { color: var(--t-fail); } .term .h { color: var(--t-violet); font-weight: 500; }
.cursor { display: inline-block; width: .55em; height: 1.1em; background: var(--code-fg); vertical-align: -2px; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0 } }

/* Lecteur d'enregistrement */
.player { background: var(--code-bg); color: var(--code-fg); border-radius: 8px; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); overflow: hidden; min-width: 0; font: 400 13px/1.45 var(--mono); }
.pl-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; background: color-mix(in srgb, var(--code-bg) 80%, #5A6B77); }
.pl-badge { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 500 11.5px/1.3 var(--mono); color: #9FB0BB; min-width: 0; }
.pl-badge b { color: var(--code-fg); font-weight: 600; }
.pill { font: 600 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; color: #0A1015; background: #7F95A3; white-space: nowrap; }
.pill.ok { background: var(--t-ok); } .pill.fail { background: var(--t-fail); } .pill.run { background: var(--t-amber); } .pill.warn { background: var(--t-warn); }
.pl-ctl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.pl-btn { font: 600 12px/1 var(--mono); color: var(--code-fg); background: transparent; border: 1px solid #3A4C58; border-radius: 4px; padding: 6px 9px; cursor: pointer; min-width: 32px; }
.pl-btn:hover { border-color: #7F95A3; }
.pl-btn[aria-pressed="true"] { background: var(--t-teal); border-color: var(--t-teal); color: #0A1015; }
.pl-btn.main { background: var(--t-amber); border-color: var(--t-amber); color: #0A1015; min-width: 64px; }
.pl-seek { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--code-line); }
.pl-seek input { flex: 1; min-width: 0; accent-color: var(--t-amber); }
.pl-seek span { font: 500 11.5px/1 var(--mono); color: #9FB0BB; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pl-status { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--code-line); min-width: 0; }
.pl-status .cmd { color: var(--code-fg); font-weight: 600; overflow-wrap: anywhere; }
.pl-status .cmd::before { content: "▶ "; color: var(--t-amber); }
.pl-status .play { color: var(--t-teal); overflow-wrap: anywhere; }
.pl-status .task { color: #9FB0BB; overflow-wrap: anywhere; }
.pl-status .cnt { margin-left: auto; white-space: nowrap; color: var(--code-dim); }
.pl-status .cnt b { font-weight: 600; }
.pl-grid { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); min-width: 0; }
.pl-grid > * { min-width: 0; }
.pl-box { padding: 10px 12px; border-right: 1px solid var(--code-line); border-bottom: 1px solid var(--code-line); min-width: 0; }
.pl-box:last-child { border-right: 0; }
.pl-h { font: 500 10.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--t-teal); margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pl-h small { color: var(--code-dim); letter-spacing: .04em; text-transform: none; font-size: 11px; }
.pl-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.pl-steps > li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
.pl-steps .ic { text-align: center; }
.pl-steps .nm { overflow-wrap: anywhere; }
.pl-steps .du { color: var(--code-dim); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.pl-steps .done .ic { color: var(--t-ok); } .pl-steps .failed .ic, .pl-steps .failed .nm { color: var(--t-fail); }
.pl-steps .running .nm { color: #F2F6F8; font-weight: 600; } .pl-steps .running .ic { color: var(--t-amber); }
.pl-steps .pending, .pl-steps .skipped { color: var(--code-dim); }
.pl-steps .skipped .nm { text-decoration: line-through; }
.pl-steps .ck { grid-column: 2 / -1; list-style: none; margin: 0 0 4px; padding: 0; font-size: 11.5px; color: #9FB0BB; display: grid; gap: 1px; }
.pl-steps .ck .ok::before { content: "✔ "; color: var(--t-ok); } .pl-steps .ck .ko { color: var(--t-fail); } .pl-steps .ck .ko::before { content: "✘ "; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(1turn); } }
.pl-log { margin: 0; height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.5; padding: 0; }
.pl-log div { min-height: 1.5em; }
.pl-log .step { color: var(--t-violet); font-weight: 600; } .pl-log .task { color: var(--t-teal); } .pl-log .ok { color: var(--t-ok); }
.pl-log .fail { color: var(--t-fail); } .pl-log .chg { color: var(--t-amber); } .pl-log .dim { color: var(--code-dim); } .pl-log .acc { color: var(--t-amber); font-weight: 600; }
.pl-probes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.pl-probes:empty { display: none; }
.probe { padding: 10px 12px; border-top: 1px solid var(--code-line); border-right: 1px solid var(--code-line); min-width: 0; }
.side .probe:first-child { border-top: 0; }
.probe .note { color: #9FB0BB; font-size: 11.5px; margin: -4px 0 8px; overflow-wrap: anywhere; }
.probe table { border-collapse: collapse; width: 100%; font-size: 12px; }
.probe th { text-align: left; font-weight: 500; color: var(--code-dim); padding: 2px 10px 4px 0; white-space: nowrap; font-size: 11px; }
.probe td { padding: 2px 10px 2px 0; white-space: nowrap; vertical-align: middle; font-variant-numeric: tabular-nums; }
.probe .tw { overflow-x: auto; }
.probe .empty, .probe .stale { color: var(--code-dim); font-style: italic; }
.probe .err { color: var(--t-fail); white-space: pre-wrap; font-size: 11.5px; }
.probe dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 6px 0 0; font-size: 12px; }
.probe dt { color: #F2F6F8; font-weight: 600; } .probe dd { margin: 0; overflow-wrap: anywhere; }
.probe .series { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; font-size: 12px; align-items: center; }
.probe .series span { display: inline-flex; gap: 6px; align-items: center; }
.probe .lines { margin: 6px 0 0; white-space: pre-wrap; color: #9FB0BB; font-size: 11.5px; }
.spark { width: 80px; height: 18px; vertical-align: middle; }
.dotst { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7F95A3; margin-right: 6px; vertical-align: 0; }
.dotst.ok { background: var(--t-ok); } .dotst.warn { background: var(--t-warn); } .dotst.fail { background: var(--t-fail); }
.s-ok { color: var(--t-ok); } .s-warn { color: var(--t-warn); } .s-fail { color: var(--t-fail); } .s-unknown, .s-dim { color: var(--code-dim); }
.s-label { color: #F2F6F8; font-weight: 600; } .s-teal { color: var(--t-teal); } .s-acc { color: var(--t-amber); }
.barv { display: inline-block; width: 64px; height: 7px; background: #2A3C48; border-radius: 2px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
.barv i { display: block; height: 100%; background: var(--t-teal); }
.barv.warn i { background: var(--t-warn); }
.pips { letter-spacing: -1px; margin-left: 6px; }
.pl-empty { padding: 22px 16px; color: #9FB0BB; display: grid; gap: 8px; }
.pl-empty b { color: var(--code-fg); }
.pl-empty code { background: #1E2C36; color: var(--t-amber); }

/* Notes de l'orateur */
.notes-panel { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); max-height: 40vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--amber); border-radius: 6px; padding: 14px 18px; box-shadow: 0 12px 40px rgb(0 0 0 / .18); display: grid; gap: 8px; z-index: 10; font-size: 15px; }
.notes-panel[hidden] { display: none; }
.notes-panel .nh { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }

/* Bas : LED de progression + navigation */
.foot {
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
}
.dots { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; align-items: center; }
.dot { width: 22px; height: 8px; border-radius: 2px; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.dot.seen { background: color-mix(in srgb, var(--teal) 45%, var(--line)); }
.dot.cur { background: var(--amber); }
.dot.app { width: 10px; background: transparent; border: 1.5px solid var(--line); }
.dot.app.seen { border-color: color-mix(in srgb, var(--teal) 45%, var(--line)); }
.dot.app.cur { border-color: var(--amber); background: var(--amber); }
.dots .gap { width: 8px; }
.nav { display: flex; align-items: center; gap: 10px; font: 500 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.stepdots { display: inline-flex; gap: 3px; }
.stepdots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.stepdots i.on { background: var(--teal); }
.navbtn { width: 38px; height: 34px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font: 500 16px/1 var(--mono); }
.navbtn:disabled { opacity: .35; cursor: default; }
.hint { font: 400 12px/1 var(--mono); color: var(--muted); }

@media (max-width: 820px) {
  body { font-size: 16px; }
  .cover { grid-template-columns: minmax(0, 1fr); }
  .pipe { grid-template-columns: 1fr; gap: 14px; }
  .pipe li { padding: 0 0 0 36px; }
  .pipe li::after { top: 22px; left: 10px; width: 2px; height: calc(100% - 8px); right: auto; }
  .hint, .bar .right > span { display: none; }
  .dot { width: 14px; }
  .inner { justify-content: flex-start; }
  .pl-grid { grid-template-columns: minmax(0, 1fr); }
  .pl-box { border-right: 0; }
  .pl-status .cnt { margin-left: 0; }
  .pl-log { height: 220px; }
}
.pipe.vert { grid-template-columns: 1fr; gap: 14px; }
.pipe.vert li { padding: 0 0 0 36px; }
.pipe.vert li::after { top: 22px; left: 10px; width: 2px; height: calc(100% - 8px); right: auto; }
@media (prefers-reduced-motion: reduce) {
  .slide, .slide.active { transition: none; transform: none; }
  .unit .led, .cursor, .spin, .tabpanel { animation: none; }
  .pipe li, .pipe li::before, .pipe li::after { transition: none; }
}
@media print {
  body { overflow: visible; }
  .app { display: block; height: auto; }
  .bar, .foot, .notes-panel, .replay, .pl-ctl, .pl-seek { display: none !important; }
  .stage { overflow: visible; }
  .slide { position: relative; visibility: visible; opacity: 1; transform: none; break-after: page; overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="tag"><span class="led"></span><b><!--@NAME@--></b><span id="stitle"><!--@SUBTITLE@--></span></div>
    <div class="right"><!--@FOOTER@--><button class="iconbtn" id="theme" type="button" title="Thème (t)">◐ auto</button></div>
  </header>

  <main class="stage" id="stage">
<!--@SLIDES@-->
  </main>

  <footer class="foot">
    <div class="dots" id="dots"></div>
    <div class="nav">
      <span class="hint" id="hint">← → espace</span>
      <button class="iconbtn" id="notes-btn" type="button" title="Notes (n)" hidden>Notes</button>
      <button class="navbtn" id="prev" type="button" aria-label="Précédent">←</button>
      <span id="count"><!--@COUNT@--></span>
      <span class="stepdots" id="stepdots" aria-hidden="true"></span>
      <button class="navbtn" id="next" type="button" aria-label="Suivant">→</button>
    </div>
  </footer>
  <aside class="notes-panel" id="notes" hidden aria-live="polite"></aside>
</div>
<!--@DATA@-->
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('deck-data').textContent);
  const slides = [...document.querySelectorAll('.slide')];
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const W = {};
  let cur = -1, step = 0, maxSeen = 0;

  /* ---------- widgets ---------- */
  const widgets = {
    tabs(el) {
      const tabs = [...el.querySelectorAll('.tab')], panels = [...el.querySelectorAll('.tabpanel')];
      const set = k => {
        tabs.forEach((t, i) => { t.setAttribute('aria-selected', String(i === k)); t.tabIndex = i === k ? 0 : -1; });
        panels.forEach((p, i) => { p.hidden = i !== k; });
      };
      tabs.forEach((t, i) => t.addEventListener('click', () => { set(i); syncStep(el.id, i); }));
      return { set };
    },
    pipeline(el) {
      const items = [...el.querySelectorAll('.pipe li')];
      let timers = [];
      const set = n => { timers.forEach(clearTimeout); timers = []; items.forEach((li, k) => li.classList.toggle('lit', k < n)); };
      el.querySelector('.replay').addEventListener('click', () => {
        const n = items.length;
        set(0);
        if (reduce) { set(n); syncStep(el.id, n); return; }
        items.forEach((li, k) => timers.push(setTimeout(() => li.classList.add('lit'), 250 + k * 420)));
        timers.push(setTimeout(() => syncStep(el.id, n, true), 250 + n * 420));
      });
      return { set };
    },
    term(el) {
      const out = el.querySelector('.term-out');
      let lines = [];
      try { lines = JSON.parse(el.dataset.lines || '[]'); } catch (e) { lines = []; }
      const line = ([k, s]) => k === '$' ? `<span class="p">$</span> ${esc(s)}`
        : ({ c: 1, h: 1, g: 1, r: 1 }[k] ? `<span class="${k}">${esc(s)}</span>` : esc(s));
      let run = 0;
      const play = () => {
        const id = ++run;
        if (reduce) { out.innerHTML = lines.map(line).join('\n'); return; }
        const done = []; let i = 0;
        const paint = partial => { out.innerHTML = done.join('\n') + (done.length ? '\n' : '') + (partial ?? '') + '<span class="cursor"></span>'; };
        const next = () => {
          if (id !== run) return;
          if (i >= lines.length) { paint(); return; }
          const [k, s] = lines[i++];
          if (k !== '$') { done.push(line([k, s])); paint(); setTimeout(next, k === 'h' ? 260 : k === 'g' || k === 'r' ? 360 : 180); return; }
          let n = 0;
          const type = () => {
            if (id !== run) return;
            n++;
            paint(`<span class="p">$</span> ${esc(s.slice(0, n))}`);
            if (n < s.length) setTimeout(type, 22 + Math.random() * 30);
            else { done.push(line([k, s])); setTimeout(next, 420); }
          };
          type();
        };
        next();
      };
      el.querySelector('.replay').addEventListener('click', play);
      return { play, set() {} };
    },
    live(el) { return Player(el); }
  };

  /* ---------- lecteur d'enregistrement ---------- */
  function Player(el) {
    let P = {};
    try { P = JSON.parse(($(el.dataset.src) || {}).textContent || '{}'); } catch (e) { P = { error: 'données illisibles' }; }
    const STY = { step: 1, task: 1, ok: 1, fail: 1, chg: 1, dim: 1, acc: 1, text: 1 };
    const ST = s => ['ok', 'warn', 'fail', 'unknown'].includes(s) ? s : 'unknown';
    const fmt = s => { s = Math.max(0, Math.round(+s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, p = n => String(n).padStart(2, '0'); return (h ? h + ':' + p(m) : p(m)) + ':' + p(s % 60); };
    const num = v => { const n = +v; return Number.isFinite(n) ? (Math.abs(n) >= 100 || Number.isInteger(n) ? String(Math.round(n * 10) / 10) : n.toFixed(1)) : '—'; };
    const title = P.title || P.scenario || 'scénario';
    if (P.missing || P.error) {
      el.innerHTML = `<div class="pl-top"><div class="pl-badge"><b>${esc(title)}</b></div><span class="pill">aucun enregistrement</span></div>
        <div class="pl-empty">${P.error ? `<b>Enregistrement inutilisable</b><span>${esc(P.error)}</span>`
          : `<b>Pas encore de run enregistré pour « ${esc(P.scenario)} ».</b><span>Lancer <code>preview rehearse ${esc(P.scenario)}</code>, puis réexporter le deck.</span>`}</div>`;
      return { set() {} };
    }
    const evs = Array.isArray(P.events) ? P.events : [];
    const meta = P.meta || {};
    // horloge compressée : un silence ne dure jamais plus de 1,5 s
    const ct = []; let acc = 0, prevT = 0;
    evs.forEach((e, i) => { const t = +e.t || 0; acc += i ? Math.min(Math.max(0, t - prevT), 1.5) : 0; prevT = t; ct.push(acc); });
    const total = acc;
    const verdict = P.verdict;
    const vcls = verdict === 'VERT' ? 'ok' : verdict === 'ROUGE' ? 'fail' : 'warn';
    const badge = ['enregistrement du ' + esc(P.date || '?'), meta.git ? esc(meta.git) : '', meta.host ? esc(meta.host) : ''].filter(Boolean).join(' · ');
    el.innerHTML = `
      <div class="pl-top">
        <div class="pl-badge"><b>${esc(title)}</b><span>${badge}</span><span class="pill ${vcls}">${esc(verdict || 'incomplet')}</span></div>
        <div class="pl-ctl">
          <button class="pl-btn main" type="button" data-a="play">▶ Lecture</button>
          <button class="pl-btn" type="button" data-sp="1" aria-pressed="false">×1</button>
          <button class="pl-btn" type="button" data-sp="4" aria-pressed="true">×4</button>
          <button class="pl-btn" type="button" data-sp="16" aria-pressed="false">×16</button>
          <button class="pl-btn" type="button" data-a="restart" title="Recommencer">↺</button>
          <button class="pl-btn" type="button" data-a="end" title="Aller à la fin">⏭</button>
        </div>
      </div>
      <div class="pl-seek"><input type="range" min="0" max="${evs.length}" value="${evs.length}" aria-label="Position dans l'enregistrement"><span class="pos"></span></div>
      <div class="pl-status"></div>
      <div class="pl-grid">
        <div class="pl-box"><div class="pl-h">Étapes <small class="stc"></small></div><ol class="pl-steps"></ol></div>
        <div class="pl-box side"><div class="pl-probes side-probes" style="grid-template-columns:1fr"></div><div class="pl-h">Journal <small class="lgc"></small></div><div class="pl-log" role="log"></div></div>
      </div>
      <div class="pl-probes bottom-probes"></div>`;
    const q = s => el.querySelector(s);
    const ui = { steps: q('.pl-steps'), stc: q('.stc'), log: q('.pl-log'), lgc: q('.lgc'), status: q('.pl-status'),
      side: q('.side-probes'), bottom: q('.bottom-probes'), seek: q('.pl-seek input'), pos: q('.pos'), play: q('[data-a=play]') };
    let stick = true;
    ui.log.addEventListener('scroll', () => { stick = ui.log.scrollTop + ui.log.clientHeight >= ui.log.scrollHeight - 8; });

    const mkre = src => { try { return src ? new RegExp(src) : null; } catch (e) { return null; } };
    const fresh = () => ({
      steps: (P.plan || []).map(p => ({ name: String(p.name), re: mkre(p.re), state: 'pending', t0: null, t1: null, checks: [], failed: false })),
      cur: -1, command: '', play: '', task: '', counts: {}, totals: {}, commands: 0, tasks: 0, metrics: {},
      log: [], result: null, rc: null, saw: false, probes: {}, hist: {}, t: 0, ended: false
    });
    let S = fresh(), idx = 0;
    const closeCur = (t) => { const st = S.steps[S.cur]; if (st && st.state === 'running') { st.state = st.failed ? 'failed' : 'done'; st.t1 = t; } };
    function stepTo(name, t) {
      S.saw = true;
      closeCur(t);
      const start = S.cur + 1;
      for (let k = start; k < S.steps.length; k++) {
        const s = S.steps[k];
        if (s.state === 'pending' && s.re && s.re.test(name)) {
          for (let j = start; j < k; j++) if (S.steps[j].state === 'pending') S.steps[j].state = 'skipped';
          Object.assign(s, { name, state: 'running', t0: t }); S.cur = k; return;
        }
      }
      S.steps.splice(start, 0, { name, re: null, state: 'running', t0: t, t1: null, checks: [], failed: false });
      S.cur = start;
    }
    function closeRun(t) {
      const st = S.steps[S.cur];
      if (st && st.state === 'running') { st.state = st.failed || S.result === false ? 'failed' : 'done'; st.t1 = t; }
      S.steps.forEach(s => { if (s.state === 'pending') s.state = 'skipped'; });
    }
    function apply(e, t) {
      if (!Array.isArray(e)) return;
      switch (e[0]) {
        case 'step': stepTo(String(e[1]), t); break;
        case 'check': if (S.cur < 0) stepTo('(sans étape)', t); S.steps[S.cur].checks.push([!!e[1], String(e[2])]); if (!e[1]) S.steps[S.cur].failed = true; break;
        case 'metric': (S.metrics[e[1]] = S.metrics[e[1]] || []).push(+e[2]); break;
        case 'result': S.result = !!e[1]; closeRun(t); break;
        case 'command': S.command = String(e[1]); S.play = S.task = ''; S.counts = {}; S.commands++; break;
        case 'play': S.play = String(e[1]); break;
        case 'task': S.task = String(e[1]); S.tasks++; break;
        case 'host_result': S.counts[e[1]] = (S.counts[e[1]] || 0) + 1; break;
        case 'recap': if (e[2] && typeof e[2] === 'object') for (const [k, v] of Object.entries(e[2])) S.totals[k] = (S.totals[k] || 0) + (+v || 0); break;
      }
    }
    const isProbe = p => p && typeof p === 'object' && !Array.isArray(p) && ['title', 'columns', 'rows', 'items', 'series', 'lines', 'status', 'note', 'error'].some(k => k in p);
    function feed(ev) {
      if (!ev || typeof ev !== 'object') return;
      S.t = +ev.t || S.t;
      if (ev.k === 'line') {
        S.log.push([STY[ev.s] ? ev.s : 'text', String(ev.v ?? '')]);
        if (S.log.length > 600) S.log.splice(0, S.log.length - 400);
        (Array.isArray(ev.e) ? ev.e : []).forEach(e => apply(e, S.t));
      } else if (ev.k === 'snap' && ev.v && typeof ev.v === 'object' && !Array.isArray(ev.v)) {
        for (const [name, p] of Object.entries(ev.v)) {
          if (!isProbe(p)) continue;
          S.probes[name] = p;
          (Array.isArray(p.series) ? p.series : []).forEach(se => {
            if (!se || !Number.isFinite(+se.v)) return;
            const key = name + '\u0000' + se.label;
            (S.hist[key] = S.hist[key] || []).push(+se.v);
            if (S.hist[key].length > 120) S.hist[key].shift();
          });
        }
      } else if (ev.k === 'end') {
        S.rc = ev.v; S.ended = true;
        if (!S.saw && !S.steps.length) { S.steps.push({ name: 'scénario', re: null, state: 'running', t0: 0, t1: null, checks: [], failed: false }); S.cur = 0; }
        if (S.result === null) S.result = +ev.v === 0 && !S.steps.some(x => x.failed);
        closeRun(S.t);
      }
    }

    /* rendu */
    const spark = (vals, cls) => {
      if (!vals || vals.length < 2) return '';
      const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1, n = vals.length;
      const pts = vals.map((v, i) => `${(i / (n - 1) * 78 + 1).toFixed(1)},${(16 - (v - lo) / span * 14 + 1).toFixed(1)}`).join(' ');
      return `<svg class="spark ${cls}" viewBox="0 0 80 18" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
    };
    function cell(col, v) {
      if (v === null || v === undefined) return '<span class="s-dim">—</span>';
      const o = typeof v === 'object' && !Array.isArray(v) ? v : null;
      switch (col.type) {
        case 'badge': {
          const st = ST(o ? o.status : v), tx = o ? (o.text ?? o.status) : v;
          return `<span class="dotst ${st}"></span><span class="s-${st}">${esc(tx)}</span>`;
        }
        case 'bar': {
          if (!o) return esc(v);
          const val = +o.v, max = +o.max, pct = max > 0 ? Math.max(0, Math.min(1, val / max)) : 0;
          return `<span class="barv${pct >= .85 ? ' warn' : ''}"><i style="width:${(pct * 100).toFixed(1)}%"></i></span>${esc(num(val))}/${esc(num(max))}${o.unit ? esc(o.unit) : ''}`;
        }
        case 'num': {
          const val = o ? +o.v : +v, unit = o && o.unit ? o.unit : (col.unit || '');
          const cls = Number.isFinite(+col.crit) && val >= +col.crit ? 's-fail' : Number.isFinite(+col.warn) && val >= +col.warn ? 's-warn' : '';
          return `<span class="${cls}">${esc(num(val))}${esc(unit)}</span>`;
        }
        case 'ratio': {
          if (!o) return esc(v);
          const val = +o.v || 0, max = +o.max || 0, pips = Math.min(max, 16), on = max ? Math.round(val / max * pips) : 0;
          const cls = max && val === max ? 's-ok' : 's-warn';
          return `<span class="${cls}">${esc(num(val))}/${esc(num(max))}</span><span class="pips ${cls}">${'▮'.repeat(on)}</span><span class="pips s-dim" style="margin-left:0">${'▯'.repeat(Math.max(0, pips - on))}</span>`;
        }
        default: {
          const sty = { label: 's-label', teal: 's-teal', dim: 's-dim', acc: 's-acc' }[col.style] || '';
          const tx = o ? (o.text ?? o.v ?? '') : v;
          return `<span class="${sty}">${esc(tx)}</span>`;
        }
      }
    }
    function probe(name, p) {
      const st = ST(p.status);
      let h = `<div class="probe"><div class="pl-h"><span><span class="dotst ${st}"></span>${esc(p.title || name)}</span></div>`;
      if (p.note) h += `<div class="note">${esc(p.note)}</div>`;
      if (p.error) h += `<div class="err">indisponible : ${esc(p.error)}</div>`;
      const cols = Array.isArray(p.columns) ? p.columns.filter(c => c && typeof c === 'object') : [];
      const rows = Array.isArray(p.rows) ? p.rows.filter(r => r && typeof r === 'object') : [];
      if (cols.length) {
        if (!rows.length) h += `<div class="empty">${esc(p.empty || 'rien à afficher')}</div>`;
        else {
          h += '<div class="tw"><table><thead><tr><th></th>' + cols.map(c => `<th>${esc(c.label ?? c.id)}</th>`).join('') + '</tr></thead><tbody>';
          h += rows.map(r => `<tr><td><span class="dotst ${ST(r.status)}"></span></td>` +
            cols.map(c => `<td>${cell(c, (r.cells || {})[c.id])}</td>`).join('') + '</tr>').join('');
          h += '</tbody></table></div>';
        }
      } else if (p.empty && !(p.items || []).length && !(p.series || []).length && !(p.lines || []).length) h += `<div class="empty">${esc(p.empty)}</div>`;
      const items = Array.isArray(p.items) ? p.items.filter(x => x && typeof x === 'object') : [];
      if (items.length) h += '<dl>' + items.map(it => `<dt>${esc(it.label)}</dt><dd>${it.status ? `<span class="s-${ST(it.status)}">${esc(it.value)}</span>` : esc(it.value)}</dd>`).join('') + '</dl>';
      const series = Array.isArray(p.series) ? p.series.filter(x => x && typeof x === 'object') : [];
      if (series.length) {
        const sty = s => ({ teal: 's-teal', acc: 's-acc', ok: 's-ok', warn: 's-warn', fail: 's-fail', dim: 's-dim' }[s] || 's-teal');
        h += '<div class="series">' + series.map(se => `<span><span class="s-dim">${esc(se.label)}</span>${spark(S.hist[name + '\u0000' + se.label], sty(se.style))}<b>${esc(num(se.v))}</b></span>`).join('') + '</div>';
      }
      const lines = Array.isArray(p.lines) ? p.lines : [];
      if (lines.length) h += `<div class="lines">${lines.map(esc).join('\n')}</div>`;
      return h + '</div>';
    }
    const metricsPanel = () => {
      const ks = Object.keys(S.metrics);
      if (!ks.length) return '';
      return `<div class="probe"><div class="pl-h">Mesures</div><div class="series">` +
        ks.map(k => { const v = S.metrics[k]; return `<span><span class="s-dim">${esc(k)}</span>${spark(v.slice(-60), 's-teal')}<b>${esc(num(v[v.length - 1]))}</b></span>`; }).join('') + '</div></div>';
    };
    let raf = 0;
    const render = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
    function draw() {
      const running = !S.ended && S.result === null;
      const done = S.steps.filter(s => s.state === 'done' || s.state === 'failed').length;
      ui.stc.textContent = `${done}/${S.steps.length}`;
      ui.steps.innerHTML = S.steps.map(s => {
        const ic = { done: '✔', failed: '✘', skipped: '–', pending: '·' }[s.state] || (running && !reduce ? '<span class="spin"></span>' : '◐');
        const du = s.t0 !== null ? fmt((s.t1 ?? S.t) - s.t0) : '';
        const ck = s.checks.slice(-4).map(([ok, tx]) => `<li class="${ok ? 'ok' : 'ko'}">${esc(tx)}</li>`).join('');
        const more = s.checks.length > 4 ? `<li>+${s.checks.length - 4} autres</li>` : '';
        return `<li class="${esc(s.state)}"><span class="ic">${ic}</span><span class="nm">${esc(s.name)}</span><span class="du">${du}</span>${ck || more ? `<ul class="ck">${more}${ck}</ul>` : ''}</li>`;
      }).join('') || '<li class="pending"><span class="ic">·</span><span class="nm">aucune étape</span><span></span></li>';
      const c = S.counts, tt = S.totals;
      const counts = `ok <b class="s-ok">${c.ok || 0}</b> · changed <b class="s-acc">${c.changed || 0}</b> · failed <b class="${c.failed ? 's-fail' : ''}">${c.failed || 0}</b>`;
      const tot = (tt.ok || tt.changed || tt.failed) ? ` <span class="s-dim">· total ok ${tt.ok || 0} · changed ${tt.changed || 0} · failed ${tt.failed || 0}</span>` : '';
      const v = S.result === null ? (S.ended ? 'incomplet' : 'en cours') : S.result ? 'VERT' : 'ROUGE';
      const vc = S.result === null ? 'run' : S.result ? 'ok' : 'fail';
      ui.status.innerHTML = `<span class="pill ${vc}">${esc(v)}</span>` +
        (S.command ? `<span class="cmd">${esc(S.command)}</span>` : '') +
        (S.play ? `<span class="play">PLAY [${esc(S.play)}]</span>` : '') +
        (S.task ? `<span class="task">TASK [${esc(S.task)}]</span>` : '') +
        (S.tasks || c.ok || c.changed ? `<span class="cnt">${counts}${tot}</span>` : `<span class="cnt">${fmt(S.t)}</span>`);
      ui.lgc.textContent = `${S.log.length} lignes`;
      ui.log.innerHTML = S.log.slice(-300).map(([s, tx]) => `<div class="${s}">${esc(tx)}</div>`).join('');
      if (stick) ui.log.scrollTop = ui.log.scrollHeight;
      const side = [], bottom = [];
      for (const [name, p] of Object.entries(S.probes)) ((P.place || {})[name] === 'side' ? side : bottom).push(probe(name, p));
      const m = metricsPanel(); if (m) bottom.push(m);
      ui.side.innerHTML = side.join('');
      ui.bottom.innerHTML = bottom.join('');
      ui.seek.value = idx;
      ui.pos.textContent = `${fmt(S.t)} / ${fmt(P.duration || (evs.length ? evs[evs.length - 1].t : 0))}`;
      ui.play.textContent = timer ? '❚❚ Pause' : '▶ Lecture';
    }

    /* lecture */
    let timer = 0, speed = 4, vt = 0;
    const seek = n => { S = fresh(); idx = 0; while (idx < n && idx < evs.length) feed(evs[idx++]); vt = idx ? ct[idx - 1] : 0; render(); };
    const stop = () => { clearInterval(timer); timer = 0; render(); };
    const tick = () => {
      vt += 0.05 * speed;
      while (idx < evs.length && ct[idx] <= vt) feed(evs[idx++]);
      if (idx >= evs.length) stop(); else render();
    };
    const play = () => { if (timer) return stop(); if (idx >= evs.length) seek(0); timer = setInterval(tick, 50); render(); };
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || !el.contains(b)) return;
      if (b.dataset.sp) { speed = +b.dataset.sp; el.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
      else if (b.dataset.a === 'play') play();
      else if (b.dataset.a === 'restart') { stop(); seek(0); play(); }
      else if (b.dataset.a === 'end') { stop(); seek(evs.length); }
    });
    ui.seek.addEventListener('input', () => { stop(); seek(+ui.seek.value); });
    seek(evs.length);
    return { set() {}, stop };
  }

  /* ---------- navigation ---------- */
  const dots = $('dots'), count = $('count'), stitle = $('stitle'), stepdots = $('stepdots');
  const subtitle = stitle.textContent;
  slides.forEach((s, i) => {
    if (D.slides[i].appendix && (i === 0 || !D.slides[i - 1].appendix)) { const g = document.createElement('span'); g.className = 'gap'; dots.appendChild(g); }
    const b = document.createElement('button');
    b.className = 'dot' + (D.slides[i].appendix ? ' app' : ''); b.type = 'button';
    b.setAttribute('aria-label', `${D.slides[i].appendix ? 'Annexe ' + D.slides[i].label : 'Diapositive ' + D.slides[i].label} : ${D.slides[i].title}`);
    b.addEventListener('click', () => go(i));
    s.dataset.dot = dots.children.length;
    dots.appendChild(b);
  });
  const dotEls = () => slides.map(s => dots.children[+s.dataset.dot]);
  document.querySelectorAll('[data-widget]').forEach(el => { const f = widgets[el.dataset.widget]; if (f && el.id) W[el.id] = f(el); });

  function syncStep(id, v, last) {
    const sl = D.slides[cur]; if (!sl || !slides[cur].contains($(id))) return;
    let k = -1;
    sl.steps.forEach((st, j) => { if (st[id] === v && (k < 0 || last)) k = j; });
    if (k >= 0) { step = k; paintSteps(); hash(); }
  }
  function paintSteps() {
    const n = D.slides[cur].steps.length;
    stepdots.innerHTML = n > 1 ? Array.from({ length: n }, (_, k) => `<i class="${k <= step ? 'on' : ''}"></i>`).join('') : '';
  }
  function hash() { if (history.replaceState) history.replaceState(null, '', '#' + (cur + 1) + (step ? '.' + (step + 1) : '')); }
  function go(i, s = 0) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    const n = D.slides[i].steps.length;
    s = s < 0 ? n - 1 : Math.max(0, Math.min(n - 1, s));
    const changed = i !== cur;
    cur = i; step = s;
    if (changed) {
      slides.forEach((el, k) => { el.classList.toggle('active', k === i); el.classList.toggle('before', k < i); el.setAttribute('aria-hidden', String(k !== i)); el.inert = k !== i; });
      maxSeen = Math.max(maxSeen, i);
      dotEls().forEach((d, k) => { d.classList.toggle('cur', k === i); d.classList.toggle('seen', k <= maxSeen && k !== i); });
      const sl = D.slides[i];
      count.textContent = sl.appendix ? `Annexe ${sl.label}` : `${sl.label} / ${D.main}`;
      stitle.textContent = sl.cover ? subtitle : sl.title;
      $('prev').disabled = i === 0;
      $('next').disabled = i === slides.length - 1 && n <= 1;
      slides[i].scrollTop = 0;
      slides[i].querySelectorAll('[data-widget="term"]').forEach(el => W[el.id] && W[el.id].play());
      notesFill();
    }
    const st = D.slides[i].steps[step] || {};
    for (const [id, v] of Object.entries(st)) if (W[id]) W[id].set(v);
    $('next').disabled = i === slides.length - 1 && step >= n - 1;
    paintSteps(); hash();
  }
  const next = () => { if (step < D.slides[cur].steps.length - 1) go(cur, step + 1); else if (cur < slides.length - 1) go(cur + 1, 0); };
  const prev = () => { if (step > 0) go(cur, step - 1); else if (cur > 0) go(cur - 1, -1); };

  /* notes */
  const notes = $('notes'), notesBtn = $('notes-btn');
  notesBtn.hidden = !D.slides.some(s => s.notes);
  function notesFill() {
    const a = slides[cur].querySelector('.notes');
    notes.innerHTML = '<div class="nh">Notes · ' + esc(D.slides[cur].title) + '</div>' + (a ? a.innerHTML : '<p class="muted">Pas de notes pour cette diapositive.</p>');
  }
  const toggleNotes = () => { notes.hidden = !notes.hidden; notesFill(); };
  notesBtn.addEventListener('click', toggleNotes);

  /* thème */
  const themes = ['auto', 'light', 'dark'], tlabel = { auto: '◐ auto', light: '☀ clair', dark: '☾ sombre' };
  let theme = 'auto';
  try { theme = localStorage.getItem('preview-theme') || 'auto'; } catch (e) {}
  const setTheme = t => {
    theme = themes.includes(t) ? t : 'auto';
    if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    $('theme').textContent = tlabel[theme];
    try { localStorage.setItem('preview-theme', theme); } catch (e) {}
  };
  setTheme(theme);
  $('theme').addEventListener('click', () => setTheme(themes[(themes.indexOf(theme) + 1) % 3]));

  $('prev').addEventListener('click', prev);
  $('next').addEventListener('click', next);
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tg = e.target;
    if (tg.closest && tg.closest('input, textarea, select, [contenteditable]')) return;
    const onBtn = tg.closest && tg.closest('button');
    if (['ArrowRight', 'ArrowDown', 'PageDown', 'l', 'j'].includes(e.key) || (e.key === ' ' && !onBtn) || (e.key === 'Enter' && !onBtn)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'h', 'k', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home' || e.key === 'g') go(0);
    else if (e.key === 'End' || e.key === 'G') go(slides.length - 1);
    else if (/^[1-9]$/.test(e.key)) { const k = D.slides.findIndex(s => !s.appendix && s.label === e.key); if (k >= 0) go(k); }
    else if (e.key === 'n') toggleNotes();
    else if (e.key === 't') setTheme(themes[(themes.indexOf(theme) + 1) % 3]);
    else if (e.key === 'Escape' && !notes.hidden) notes.hidden = true;
  });
  let tx = null, ty = null;
  addEventListener('touchstart', e => { if (e.target.closest('.player, .scroll-x, .tbl, pre')) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? next : prev)();
    tx = null;
  }, { passive: true });
  const fromHash = () => { const m = /^#(\d+)(?:\.(\d+))?$/.exec(location.hash || ''); return m ? [+m[1] - 1, m[2] ? +m[2] - 1 : 0] : [0, 0]; };
  addEventListener('hashchange', () => { const [i, s] = fromHash(); if (i !== cur || s !== step) go(i, s); });
  go(...fromHash());
})();
</script>
</body>
</html>
